<style>
:root{
  --bg:#f2f4f9;--surface:#ffffff;--surface-2:#e9eef6;--text:#0f172a;--muted:#5b6472;
  --border:#dfe5ee;--primary:#2563eb;--primary-2:#1d4ed8;--accent:#16a34a;--danger:#dc2626;
  --shadow:0 4px 14px rgba(15,23,42,.06);--shadow-lg:0 10px 26px rgba(15,23,42,.10);
  --radius:16px;--radius-sm:10px;--max:1080px;
  --key-bg:#ffffff;--key-op:#eef2fa;--key-fn:#f5f3ff;--key-text:#0f172a;
  --key-eq-bg:#2563eb;--key-eq-text:#ffffff;
}
[data-theme="dark"]{
  --bg:#0b1220;--surface:#131b2e;--surface-2:#1a2338;--text:#e8eefc;--muted:#9aa6bf;
  --border:#25304a;--primary:#4f8dff;--primary-2:#6ea3ff;
  --shadow:0 4px 14px rgba(0,0,0,.35);--shadow-lg:0 10px 26px rgba(0,0,0,.55);
  --key-bg:#1b2338;--key-op:#232f4b;--key-fn:#1e2a44;--key-text:#e8eefc;
  --key-eq-bg:#4f8dff;--key-eq-text:#0b1220;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Bengali",sans-serif;
  overflow-x:hidden;min-height:100vh;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:16px}
a{color:var(--primary);text-decoration:none}
.container{max-width:var(--max);margin:0 auto;padding:0 14px}

/* HEADER */
header.site-header{
  position:sticky;top:0;z-index:50;background:var(--surface);
  border-bottom:1px solid var(--border);box-shadow:var(--shadow);
}
.header-inner{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  max-width:var(--max);margin:0 auto;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand img{width:38px;height:38px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.brand-text{display:flex;flex-direction:column;line-height:1.1;min-width:0;text-align:left}
.brand-text b{font-size:16px;color:var(--text)}
.brand-text span{font-size:11px;color:var(--muted)}
.header-spacer{flex:1}
.header-actions{display:flex;align-items:center;gap:8px}
.lang-switch{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface-2)}
.lang-switch button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font-size:13px;font-weight:700}
.lang-switch button.active{background:var(--primary);color:#fff}
.icon-btn{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  width:38px;height:38px;border-radius:10px;font-size:17px;
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--surface)}

/* VIEWS */
section.view{padding:16px 14px 40px;max-width:var(--max);margin:0 auto}
.hidden{display:none!important}

/* HERO */
.hero{padding:26px 14px 12px;text-align:center}
.hero h1{font-size:clamp(24px,4vw,32px);margin:0 0 6px;letter-spacing:-.02em}
.hero p{color:var(--muted);font-size:15px;max-width:620px;margin:0 auto}

/* CRUMB */
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 0 8px;color:var(--muted);font-size:13px}
.crumb button{border:0;background:transparent;color:var(--primary);font-weight:700;padding:0;font-size:13.5px}
.crumb button:hover{text-decoration:underline}
.crumb .sep{color:var(--muted)}
.crumb .current{color:var(--text);font-weight:700}

/* BACK */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:9px 14px;border-radius:999px;font-weight:700;font-size:14px;
  margin-bottom:14px;box-shadow:var(--shadow);
}
.back-btn:hover{background:var(--surface-2)}

/* CATEGORY GRID */
.cat-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-top:10px}
.cat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;
  transition:transform .15s, box-shadow .15s, border-color .15s;
  box-shadow:var(--shadow);width:100%;
}
.cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.cat-icon{
  width:50px;height:50px;border-radius:14px;font-size:25px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg, rgba(37,99,235,.14), rgba(22,163,74,.14));
}
.cat-name{font-weight:800;font-size:16px}
.cat-desc{font-size:13.5px;color:var(--muted);line-height:1.45}
.cat-count{font-size:12px;color:var(--primary);font-weight:800;margin-top:2px}

/* CALC GRID */
.calc-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:8px}
.calc-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;display:flex;gap:12px;align-items:flex-start;text-align:left;
  transition:transform .15s, box-shadow .15s, border-color .15s;
  box-shadow:var(--shadow);width:100%;
}
.calc-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.calc-icon{
  flex:0 0 42px;width:42px;height:42px;border-radius:11px;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg, rgba(37,99,235,.14), rgba(22,163,74,.14));
}
.calc-body{min-width:0}
.calc-title{font-weight:800;font-size:15px;margin-bottom:2px}
.calc-desc{font-size:13px;color:var(--muted);line-height:1.4}

/* PANEL */
.panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  max-width:640px;margin:0 auto;
}
.panel h2{margin:0 0 4px;font-size:19px}
.panel .panel-desc{color:var(--muted);font-size:13.5px;margin:0 0 16px}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:600px){.form-grid.two{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:700}
.field input,.field select{
  padding:12px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);outline:none;width:100%;font-size:16px;
}
.field input:focus,.field select:focus{
  border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.18);background:var(--surface);
}

/* BUTTONS */
.btn{
  border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
@media (min-width:520px){.actions.row{flex-direction:row}.actions.row .btn{flex:1;width:auto}}

/* RESULT */
.result-box{
  margin-top:16px;padding:16px;border-radius:14px;
  background:linear-gradient(135deg, rgba(37,99,235,.08), rgba(22,163,74,.08));
  border:1px solid var(--border);
}
.result-box h4{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:800}
.result-main{font-size:30px;font-weight:900;line-height:1.15;word-break:break-word}
.result-rows{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
@media (min-width:520px){.result-rows{grid-template-columns:1fr 1fr}}
.result-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.result-row span{color:var(--muted);display:block;font-size:12.5px}
.result-row b{font-size:16px;display:block;word-break:break-word}

.error-msg{
  margin-top:12px;padding:11px 13px;border-radius:12px;
  background:rgba(220,38,38,.1);color:var(--danger);
  border:1px solid rgba(220,38,38,.35);font-size:13.5px;font-weight:600;display:none;
}
.error-msg.show{display:block}
.note{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}

/* CALCULATOR (basic + sci) */
.calc-shell{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;max-width:520px;margin:0 auto;
}
.calc-display{
  background:var(--surface-2);border:1px solid var(--border);border-radius:14px;
  padding:14px;text-align:right;margin-bottom:12px;min-height:110px;
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;
}
.calc-display .expr{font-size:15px;color:var(--muted);min-height:20px;word-break:break-all;line-height:1.4}
.calc-display .val{font-size:34px;font-weight:900;line-height:1.1;word-break:break-all}
.calc-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.calc-meta button{border:0;background:transparent;color:var(--primary);font-weight:700;font-size:12px}

/* KEYPAD (basic) */
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keypad button{
  border:1px solid var(--border);background:var(--key-bg);color:var(--key-text);
  border-radius:14px;padding:18px 6px;font-size:20px;font-weight:700;
  transition:transform .05s, background .1s;touch-action:manipulation;
}
.keypad button:active{transform:scale(.96)}
.keypad button.op{background:var(--key-op);color:var(--primary)}
.keypad button.fn{background:var(--key-fn);color:var(--primary);font-size:17px}
.keypad button.eq{background:var(--key-eq-bg);color:var(--key-eq-text);border-color:var(--key-eq-bg)}
.keypad button.wide{grid-column:span 2}

/* KEYPAD (scientific) */
.sci-toggle{display:flex;gap:8px;margin-bottom:10px;justify-content:flex-end}
.sci-toggle button{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:800;
}
.sci-toggle button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.sci-pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.sci-pad button{
  border:1px solid var(--border);background:var(--key-fn);color:var(--primary);
  border-radius:12px;padding:12px 2px;font-size:14px;font-weight:700;touch-action:manipulation;
}
.sci-pad button.num{background:var(--key-bg);color:var(--key-text);font-size:18px;padding:14px 2px}
.sci-pad button.op{background:var(--key-op);color:var(--primary);font-size:18px}
.sci-pad button.eq{background:var(--key-eq-bg);color:var(--key-eq-text);border-color:var(--key-eq-bg)}
.sci-pad button:active{transform:scale(.96)}

/* HISTORY */
.history{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.history-head h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800}
.history-head button{border:0;background:transparent;color:var(--danger);font-weight:700;font-size:12px}
.history-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto}
.history-item{
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;
  cursor:pointer;text-align:left;width:100%;
}
.history-item:hover{background:var(--surface)}
.history-item .e{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .r{color:var(--text);font-weight:800;flex:0 0 auto}
.history-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:8px}

/* ============================================================
   INFORMATION SECTIONS
   ============================================================ */
.info-divider{
  max-width:820px;margin:36px auto 20px;padding:0 14px;
  display:flex;align-items:center;gap:12px;color:var(--muted);
  font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
}
.info-divider::before,
.info-divider::after{content:"";flex:1;height:1px;background:var(--border)}

.info-wrap{max-width:820px;margin:0 auto;padding:0 14px}

.intro-card{
  background:linear-gradient(135deg, rgba(37,99,235,.08), rgba(22,163,74,.08));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:26px 22px;box-shadow:var(--shadow);margin-bottom:22px;
}
.intro-card h2{font-size:22px;margin:0 0 8px;font-weight:800;letter-spacing:-.01em}
.intro-card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.7}

.info-block{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);margin-bottom:16px;
}
.info-block h2{font-size:19px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
.info-block > p.lede{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.65}
.info-block p{font-size:14.5px;margin:8px 0;line-height:1.7}
.info-block ul{margin:8px 0 12px 20px;padding:0}
.info-block li{font-size:14.5px;margin:5px 0;line-height:1.65}

/* Steps */
.step-list{counter-reset:step;list-style:none;margin:12px 0 0 0;padding:0}
.step-list li{
  counter-increment:step;position:relative;
  padding:12px 16px 12px 56px;margin-bottom:8px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
  font-size:14.5px;line-height:1.6;
}
.step-list li::before{
  content:counter(step, decimal-leading-zero);
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-weight:900;font-size:13px;color:var(--primary);letter-spacing:.05em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* Available grid */
.avail-grid{display:grid;gap:10px;grid-template-columns:1fr;margin-top:10px}
@media (min-width:600px){.avail-grid{grid-template-columns:1fr 1fr}}
.avail-item{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.avail-item h3{margin:0 0 6px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.avail-item p{margin:0;font-size:13px;color:var(--muted);line-height:1.55}

/* Feature grid */
.feat-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:12px}
.feat-item{
  background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;font-size:13.5px;display:flex;align-items:center;gap:10px;
}
.feat-item .ic{
  flex:0 0 28px;width:28px;height:28px;border-radius:8px;
  background:rgba(22,163,74,.12);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;
}

/* FAQ */
.faq-list{margin-top:12px}
.faq-item{
  border:1px solid var(--border);border-radius:12px;background:var(--surface);
  margin-bottom:10px;overflow:hidden;
}
.faq-q{
  width:100%;text-align:left;border:0;background:transparent;padding:15px 16px;
  font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:12px;
  color:var(--text);align-items:center;
}
.faq-q .sign{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--primary);font-weight:900;font-size:16px;
  transition:background .15s, color .15s;
}
.faq-item.open .faq-q .sign{background:var(--primary);color:#fff}
.faq-a{
  max-height:0;overflow:hidden;
  transition:max-height .3s ease, padding .3s ease;
  font-size:14px;color:var(--muted);line-height:1.7;
  padding:0 16px;
}
.faq-item.open .faq-a{max-height:700px;padding:0 16px 16px}

/* Accordion (About/Privacy/Terms/Disclaimer/Contact) */
.acc{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;
}
.acc-head{
  width:100%;border:0;background:transparent;
  padding:16px 18px;display:flex;align-items:center;gap:12px;
  font-weight:800;font-size:15.5px;color:var(--text);text-align:left;
}
.acc-head .acc-icon{
  flex:0 0 32px;width:32px;height:32px;border-radius:9px;
  background:var(--surface-2);color:var(--primary);font-size:16px;
  display:flex;align-items:center;justify-content:center;
}
.acc-head .acc-title{flex:1;min-width:0}
.acc-head .sign{
  flex:0 0 auto;width:28px;height:28px;border-radius:50%;
  background:var(--surface-2);color:var(--primary);font-weight:900;font-size:16px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .18s, color .18s;
}
.acc.open .acc-head .sign{background:var(--primary);color:#fff}
.acc-body{
  max-height:0;overflow:hidden;
  transition:max-height .35s ease, padding .35s ease;
  padding:0 18px;
}
.acc.open .acc-body{max-height:4000px;padding:0 18px 18px}
.acc-body h3{font-size:14px;margin:14px 0 6px;font-weight:800;color:var(--text)}
.acc-body h3:first-child{margin-top:4px}
.acc-body p{font-size:14.5px;color:var(--text);margin:8px 0;line-height:1.7}
.acc-body .dev{font-weight:800;color:var(--text);margin-top:12px}
.acc-body .muted{color:var(--muted);font-size:13.5px}

/* FOOTER */
footer.site-footer{
  background:var(--surface);border-top:1px solid var(--border);
  padding:32px 14px 20px;margin-top:36px;
}
.footer-inner{
  max-width:var(--max);margin:0 auto;display:grid;gap:26px;
  grid-template-columns:1.4fr 1fr 1fr;
}
@media (max-width:820px){.footer-inner{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.footer-inner{grid-template-columns:1fr}}
.footer-brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.footer-brand img{width:36px;height:36px;border-radius:9px;object-fit:cover;background:var(--surface-2)}
.footer-brand span{font-weight:800;font-size:15px;color:var(--text)}
.footer-inner h5{margin:0 0 12px;font-size:14px;font-weight:800;letter-spacing:.02em}
.footer-inner p{margin:0 0 8px;color:var(--muted);font-size:13.5px;line-height:1.65}
.footer-links{display:flex;flex-direction:column;gap:8px}
.footer-links a{
  color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;
  text-decoration:none;background:none;border:0;padding:0;text-align:left;
}
.footer-links a:hover{color:var(--primary);text-decoration:underline}
.footer-bottom{
  max-width:var(--max);margin:24px auto 0;padding-top:16px;
  border-top:1px solid var(--border);text-align:center;
  color:var(--muted);font-size:12.5px;line-height:1.7;
}

/* AD */
.ad-slot{max-width:var(--max);margin:20px auto;padding:0 14px}
.ad-inner{
  min-height:250px;border:1px dashed var(--border);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--muted);font-size:12px;letter-spacing:.4px;background:var(--surface);
  overflow:hidden;
}
.ad-inner .ad-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ad-inner .ad-code{width:300px;max-width:100%;min-height:250px;display:flex;align-items:center;justify-content:center}
@media (max-width:600px){.ad-slot{padding:0 10px}.ad-inner{min-height:250px}.ad-inner .ad-code{width:300px;max-width:100%}}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

    "learn.body":"অল ক্যালকুলেটর একটি ফ্রি অনলাইন ক্যালকুলেটর প্ল্যাটফর্ম, যা দৈনন্দিন হিসাব সহজ, দ্রুত ও সবার জন্য উন্মুক্ত করে। এখানে বেসিক গণিত, সায়েন্টিফিক হিসাব, আর্থিক, বয়স ও তারিখ, স্বাস্থ্য, জমি, নির্মাণ এবং একক রূপান্তর — সবই এক জায়গায়, কোনো সাইনআপ ছাড়াই।",

    /* FAQ */
    "faq.title":"সাধারণ প্রশ্ন",
    "faq.lede":"অল ক্যালকুলেটর সম্পর্কে দ্রুত উত্তর।",
    "faq.q1":"অল ক্যালকুলেটর কী?",
    "faq.a1":"অল ক্যালকুলেটর একটি ফ্রি অনলাইন ক্যালকুলেটর প্ল্যাটফর্ম, যেখানে গণিত, বিজ্ঞান, আর্থিক, স্বাস্থ্য, জমি, নির্মাণ এবং একক রূপান্তরের অনেকগুলো ক্যালকুলেটর একসাথে পাওয়া যায়।",
    "faq.q2":"অল ক্যালকুলেটর কি ফ্রি?",

    "faq.q3":"আমার কি অ্যাকাউন্ট লাগবে?",
    "faq.a3":"না। রেজিস্ট্রেশন, লগইন, ইমেইল বা ফোন নম্বর ছাড়াই সব ক্যালকুলেটর ব্যবহার করা যায়।",
    "faq.q4":"মোবাইলে ব্যবহার করা যাবে?",
    "faq.a4":"হ্যাঁ। ওয়েবসাইটটি সম্পূর্ণ রেসপন্সিভ — Android, iPhone, ট্যাব, ল্যাপটপ ও ডেস্কটপে ভালোভাবে কাজ করে।",
    "faq.q5":"কোন কোন ক্যালকুলেটর আছে?",

    "faq.q6":"বেসিক ক্যালকুলেটর কি সাধারণ ক্যালকুলেটরের মতো কাজ করে?",

    "faq.q10":"ওয়েবসাইট কি আমার ইনপুট সংরক্ষণ করে?",

let LANG = localStorage.getItem('ac_lang') || 'en';
function t(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; }

function setLang(l){
  LANG = l;
  localStorage.setItem('ac_lang', l);
  document.documentElement.lang = l === 'bn' ? 'bn' : 'en';
  el('lang-en').classList.toggle('active', l==='en');
  el('lang-bn').classList.toggle('active', l==='bn');
  refreshStaticI18N();
  renderFaq();
  renderAvailGrid();
  renderWhyGrid();
  if(currentView === 'home') renderHome();
  else if(currentView === 'category' && currentCategory) showCategory(currentCategory);
  else if(currentView === 'calc' && currentCalcId) showCalc(currentCalcId);
}
function refreshStaticI18N(){
  document.querySelectorAll('[data-i18n]').forEach(n=>{
    const k = n.getAttribute('data-i18n');
    if(I18N[LANG][k] || I18N.en[k]) n.textContent = t(k);
  });
  document.querySelectorAll('[data-i18n-aria]').forEach(n=>{
    const k = n.getAttribute('data-i18n-aria');
    if(I18N[LANG][k] || I18N.en[k]) n.setAttribute('aria-label', t(k));
  });
}

/* ---------------- helpers ---------------- */
function fmt(n, digits){
  if(typeof n !== 'number' || !isFinite(n)) return '—';
  if(digits === undefined) digits = 2;
  const abs = Math.abs(n);
  if(abs !== 0 && abs < 0.0001) return n.toExponential(4);
  try{
    return n.toLocaleString(LANG==='bn'?'bn-BD':'en-US', {maximumFractionDigits:digits});
  }catch(e){ return n.toFixed(digits); }
}
function el(id){ return document.getElementById(id); }
function strVal(id){ const e = el(id); return e ? e.value : ''; }
function numVal(id){
  const v = strVal(id).trim();
  if(v === '') return null;
  const n = Number(v);
  return isFinite(n) ? n : NaN;
}

function resultHTML(main, rows, note){
  let r = `<div class="result-box" id="resultBox"><h4>${t('result.title')}</h4>`;
  r += `<div class="result-main">${main}</div>`;
  if(rows && rows.length){
    r += `<div class="result-rows">`;
    rows.forEach(x=> r += `<div class="result-row"><span>${x[0]}</span><b>${x[1]}</b></div>`);
    r += `</div>`;
  }
  r += `</div>`;
  if(note) r += `<p class="note">${note}</p>`;
  r += `<div class="actions row"><button class="btn btn-ghost" onclick="copyResult(event)">📋 ${t('btn.copy')}</button></div>`;
  return r;
}
function copyResult(ev){
  const box = el('resultBox');
  if(!box) return;
  const text = box.innerText.replace(/\n+/g,' | ').trim();
  const done = ()=>{
    const btn = ev && ev.target;
    if(btn){ const old = btn.textContent; btn.textContent = '✅ '+t('copied'); setTimeout(()=> btn.textContent = old, 1500); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(done);
  }else{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta); done();
  }
}
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){const t=a%b;a=b;b=t;} return a; }

/* =========================================================================
   SAFE MATH EXPRESSION PARSER (no eval, no Function)
   ========================================================================= */
const MathParser = (function(){
  const FUNCS = {
    sin:(x)=>Math.sin(x), cos:(x)=>Math.cos(x), tan:(x)=>Math.tan(x),
    asin:(x)=>Math.asin(x), acos:(x)=>Math.acos(x), atan:(x)=>Math.atan(x),
    sinh:(x)=>Math.sinh(x), cosh:(x)=>Math.cosh(x), tanh:(x)=>Math.tanh(x),
    log:(x)=>Math.log10(x), ln:(x)=>Math.log(x),
    sqrt:(x)=>Math.sqrt(x), cbrt:(x)=>Math.cbrt(x),
    abs:(x)=>Math.abs(x), exp:(x)=>Math.exp(x),
    fact:(x)=>{
      if(x<0 || x!==Math.floor(x) || x>170) throw new Error('Invalid factorial');
      let r=1; for(let i=2;i<=x;i++) r*=i; return r;
    }
  };
  const CONSTS = { pi:Math.PI, e:Math.E };
  const OPS = {
    '+':{p:1,f:(a,b)=>a+b},
    '-':{p:1,f:(a,b)=>a-b},
    '*':{p:2,f:(a,b)=>a*b},
    '/':{p:2,f:(a,b)=>{ if(b===0) throw new Error('Division by zero'); return a/b; }},
    '%':{p:2,f:(a,b)=>a-b*Math.floor(a/b)},
    '^':{p:4,f:(a,b)=>Math.pow(a,b), right:true}
  };
  function tokenize(src){
    const tokens = [];
    let i = 0;
    while(i < src.length){
      const c = src[i];
      if(c === ' '){ i++; continue; }
      if(/[0-9.]/.test(c)){
        let n = '';
        while(i < src.length && /[0-9.]/.test(src[i])) n += src[i++];
        const v = parseFloat(n);
        if(isNaN(v)) throw new Error('Bad number');
        tokens.push({type:'num', v});
        continue;
      }
      if(/[a-zA-Z]/.test(c)){
        let name = '';
        while(i < src.length && /[a-zA-Z]/.test(src[i])) name += src[i++];
        const lower = name.toLowerCase();
        if(CONSTS[lower] !== undefined) tokens.push({type:'num', v:CONSTS[lower]});
        else if(FUNCS[lower]) tokens.push({type:'func', v:lower});
        else throw new Error('Unknown token: ' + name);
        continue;
      }
      if(c === 'π'){ tokens.push({type:'num', v:Math.PI}); i++; continue; }
      if(c === '√'){ tokens.push({type:'func', v:'sqrt'}); i++; continue; }
      if(c === '!'){ tokens.push({type:'fact'}); i++; continue; }
      if(c === '(' || c === ')'){ tokens.push({type:c}); i++; continue; }
      if('+-*/%^'.includes(c)){ tokens.push({type:'op', v:c}); i++; continue; }
      throw new Error('Unexpected character: ' + c);
    }
    return tokens;
  }
  function toRPN(tokens){
    const out = [], stack = [];
    let prev = null;
    for(const tk of tokens){
      if(tk.type === 'num') out.push(tk);
      else if(tk.type === 'func') stack.push(tk);
      else if(tk.type === 'fact') out.push(tk);
      else if(tk.type === 'op'){
        if(tk.v === '-' && (prev === null || prev.type === 'op' || prev.type === '(')){
          stack.push({type:'unary'});
          prev = tk; continue;
        }
        while(stack.length){
          const top = stack[stack.length-1];
          if(top.type === 'op' && (OPS[top.v].p > OPS[tk.v].p ||
             (OPS[top.v].p === OPS[tk.v].p && !OPS[tk.v].right))) out.push(stack.pop());
          else break;
        }
        stack.push(tk);
      }
      else if(tk.type === '(') stack.push(tk);
      else if(tk.type === ')'){
        while(stack.length && stack[stack.length-1].type !== '(') out.push(stack.pop());
        if(!stack.length || stack[stack.length-1].type !== '(') throw new Error('Mismatched parentheses');
        stack.pop();
        if(stack.length && stack[stack.length-1].type === 'func') out.push(stack.pop());
      }
      prev = tk;
    }
    while(stack.length){
      const top = stack.pop();
      if(top.type === '(') throw new Error('Mismatched parentheses');
      out.push(top);
    }
    return out;
  }
  function evalRPN(rpn, angleMode){
    const st = [];
    const toRad = x => angleMode === 'deg' ? x*Math.PI/180 : x;
    const fromRad = x => angleMode === 'deg' ? x*180/Math.PI : x;
    for(const tk of rpn){
      if(tk.type === 'num') st.push(tk.v);
      else if(tk.type === 'unary'){ const a = st.pop(); st.push(-a); }
      else if(tk.type === 'fact'){ const a = st.pop(); st.push(FUNCS.fact(a)); }
      else if(tk.type === 'op'){
        const b = st.pop(), a = st.pop();
        st.push(OPS[tk.v].f(a,b));
      }
      else if(tk.type === 'func'){
        const a = st.pop();
        if(tk.v === 'sin') st.push(Math.sin(toRad(a)));
        else if(tk.v === 'cos') st.push(Math.cos(toRad(a)));
        else if(tk.v === 'tan') st.push(Math.tan(toRad(a)));
        else if(tk.v === 'asin') st.push(fromRad(Math.asin(a)));
        else if(tk.v === 'acos') st.push(fromRad(Math.acos(a)));
        else if(tk.v === 'atan') st.push(fromRad(Math.atan(a)));
        else st.push(FUNCS[tk.v](a));
      }
    }
    if(st.length !== 1) throw new Error('Invalid expression');
    return st[0];
  }
  return {
    evaluate(src, angleMode){
      const tokens = tokenize(src);
      const rpn = toRPN(tokens);
      const res = evalRPN(rpn, angleMode || 'deg');
      if(typeof res !== 'number' || !isFinite(res)) throw new Error('Invalid result');
      return res;
    }
  };
})();

let basicExpr = '';
const BASIC_HISTORY_KEY = 'ac_basic_history';

function basicRender(){
  return `
    <div class="calc-shell">
      <div class="calc-display">

        <button type="button" onclick="basicClearAll()">${t('basic.ac')}</button>
      </div>
      <div class="keypad">
        <button class="fn" onclick="basicIn('(')">(</button>
        <button class="fn" onclick="basicIn(')')">)</button>
        <button class="fn" onclick="basicPercent()">%</button>
        <button class="op" onclick="basicIn('÷')">÷</button>

        <button onclick="basicIn('7')">7</button>
        <button onclick="basicIn('8')">8</button>
        <button onclick="basicIn('9')">9</button>
        <button class="op" onclick="basicIn('×')">×</button>

        <button onclick="basicIn('4')">4</button>
        <button onclick="basicIn('5')">5</button>
        <button onclick="basicIn('6')">6</button>
        <button class="op" onclick="basicIn('−')">−</button>

        <button onclick="basicIn('1')">1</button>
        <button onclick="basicIn('2')">2</button>
        <button onclick="basicIn('3')">3</button>
        <button class="op" onclick="basicIn('+')">+</button>

        <button class="fn" onclick="basicToggleSign()">+/−</button>
        <button onclick="basicIn('0')">0</button>
        <button onclick="basicIn('.')">.</button>
        <button class="eq" onclick="basicEquals()">=</button>
      </div>
      <div class="history">
        <div class="history-head">
          <h4>${t('basic.history')}</h4>
          <button type="button" onclick="basicClearHistory()">${t('btn.clearHistory')}</button>
        </div>
        <div class="history-list" id="basicHistory"></div>
      </div>
      <div class="error-msg" id="errBox"></div>
    </div>
  `;
}
function basicNorm(s){ return s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-'); }
function basicUpd(){
  const e = el('basicExpr'), v = el('basicVal');
  if(!e || !v) return;
  e.textContent = basicExpr || '\u00A0';
  if(!basicExpr){ v.textContent = '0'; return; }
  try{
    const r = MathParser.evaluate(basicNorm(basicExpr), 'deg');
    v.textContent = fmt(r, 10);
  }catch(err){ v.textContent = '…'; }
}
function basicIn(s){ basicExpr += s; basicUpd(); }
function basicBackspace(){ basicExpr = basicExpr.slice(0, -1); basicUpd(); }
function basicClearAll(){ basicExpr=''; basicUpd(); hideErr(); }
function basicPercent(){
  const m = basicExpr.match(/(\d+\.?\d*)$/);
  if(m){
    const num = m[1];
    basicExpr = basicExpr.slice(0, -num.length) + '(' + num + '/100)';
  } else basicExpr += '/100';
  basicUpd();
}
function basicToggleSign(){
  const m = basicExpr.match(/(\d+\.?\d*)$/);
  if(!m) return;
  const num = m[1];
  const before = basicExpr.slice(0, -num.length);
  const prev = before.slice(-1);
  if(prev === '-' && !'*/+'.includes(before.slice(-2,-1))){
    basicExpr = before.slice(0,-1) + num;
  } else {
    basicExpr = before + '-' + num;
  }
  basicUpd();
}
function basicEquals(){
  hideErr();
  if(!basicExpr.trim()) return;
  try{
    const r = MathParser.evaluate(basicNorm(basicExpr), 'deg');
    const resultStr = (Math.abs(r) < 1e15) ? String(+r.toFixed(10)) : String(r);
    basicPushHistory(basicExpr, resultStr);
    basicExpr = resultStr;
    basicUpd();
  }catch(err){
    showErr(err.message.includes('zero') ? t('err.divZero') : t('err.badExpr'));
    const v = el('basicVal'); if(v) v.textContent = t('err.error');
  }
}
function basicPushHistory(expr, result){
  try{
    const arr = JSON.parse(localStorage.getItem(BASIC_HISTORY_KEY)||'[]');
    arr.unshift({e:expr, r:result, ts:Date.now()});
    localStorage.setItem(BASIC_HISTORY_KEY, JSON.stringify(arr.slice(0, 30)));
  }catch(e){}
  basicRenderHistory();
}
function basicRenderHistory(){
  const host = el('basicHistory');
  if(!host) return;
  let arr = [];
  try{ arr = JSON.parse(localStorage.getItem(BASIC_HISTORY_KEY)||'[]'); }catch(e){}
  if(!arr.length){ host.innerHTML = `<div class="history-empty">${t('history.empty')}</div>`; return; }
  host.innerHTML = arr.map((h,idx)=>
    `<button class="history-item" type="button" onclick="basicUseHistory(${idx})">
      <span class="e">${h.e}</span>
      <span class="r">= ${h.r}</span>
    </button>`
  ).join('');
}
function basicUseHistory(idx){
  try{
    const arr = JSON.parse(localStorage.getItem(BASIC_HISTORY_KEY)||'[]');
    if(arr[idx]){ basicExpr = arr[idx].r; basicUpd(); }
  }catch(e){}
}
function basicClearHistory(){
  localStorage.removeItem(BASIC_HISTORY_KEY);
  basicRenderHistory();
}

function calcFrac(){
  hideErr(); clearResult();
  const n1=numVal('f_n1'), d1=numVal('f_d1'), n2=numVal('f_n2'), d2=numVal('f_d2');
  if([n1,d1,n2,d2].some(x=>x===null)){ showErr(t('err.fill')); return; }
  if([n1,d1,n2,d2].some(isNaN)){ showErr(t('err.number')); return; }
  if(d1===0||d2===0){ showErr(t('err.zero')); return; }
  const op = strVal('f_op');
  let rn, rd;
  if(op==='+'){ rn=n1*d2+n2*d1; rd=d1*d2; }
  else if(op==='-'){ rn=n1*d2-n2*d1; rd=d1*d2; }
  else if(op==='*'){ rn=n1*n2; rd=d1*d2; }
  else { if(n2===0){ showErr(t('err.zero')); return; } rn=n1*d2; rd=d1*n2; }
  if(rd===0){ showErr(t('err.zero')); return; }
  const g = gcd(rn,rd) || 1;
  rn/=g; rd/=g;
  if(rd<0){ rn=-rn; rd=-rd; }
  const main = rd===1 ? String(rn) : `${rn}/${rd}`;
  el('resultHolder').innerHTML = resultHTML(main, [[t('frac.dec'), fmt(rn/rd,6)]]);
}

  render(){

        <div class="form-grid">
          <div class="field"><label>${t('age.dob')}</label><input id="ag_d" type="date" /></div>
          <div class="field"><label>${t('age.asof')}</label><input id="ag_t" type="date" /></div>
        </div>
        <div class="actions row">
          <button class="btn btn-primary" onclick="calcAge()">${t('btn.calcAge')}</button>
          <button class="btn btn-ghost" onclick="resetForm()">${t('btn.reset')}</button>
        </div>
        <div id="resultHolder"></div>
        <div class="error-msg" id="errBox"></div>
      </div>
    `;
  }
});
function calcAge(){
  hideErr(); clearResult();
  const db = strVal('ag_d'), dt = strVal('ag_t');
  if(!db){ showErr(t('err.fill')); return; }
  const dob = new Date(db);
  const ref = dt ? new Date(dt) : new Date();
  if(isNaN(dob)||isNaN(ref)){ showErr(t('err.date')); return; }
  if(dob > ref){ showErr(t('err.dobFuture')); return; }
  let y = ref.getFullYear() - dob.getFullYear();
  let m = ref.getMonth() - dob.getMonth();
  let d = ref.getDate() - dob.getDate();
  if(d < 0){ m--; d += new Date(ref.getFullYear(), ref.getMonth(), 0).getDate(); }
  if(m < 0){ y--; m += 12; }
  const totalDays = Math.floor((ref - dob) / 86400000);
  const totalWeeks = Math.floor(totalDays / 7);
  let next = new Date(ref.getFullYear(), dob.getMonth(), dob.getDate());
  const today = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  if(next < today) next.setFullYear(next.getFullYear()+1);
  const daysToBday = Math.ceil((next - ref) / 86400000);
  const main = `${y} ${t('age.years')} ${m} ${t('age.months')} ${d} ${t('age.days')}`;
  el('resultHolder').innerHTML = resultHTML(main, [
    [t('age.totalDays'), totalDays],
    [t('age.totalWeeks'), totalWeeks],
    [t('age.nextBday'), daysToBday + ' ' + t('age.daysLabel')]
  ]);
}

const UNITS = {
  length: ['mm','cm','m','km','inch','ft','yd','mile'],
  weight: ['mg','g','kg','oz','lb','ton'],
  area: ['sqm','sqft','acre','hectare'],
  volume: ['ml','l','m3','ft3','gal'],
  speed: ['km/h','mph','m/s'],
  time: ['sec','min','hr','day','week']
};
const UNIT_VALUES = {
  mm:0.001, cm:0.01, m:1, km:1000, inch:0.0254, ft:0.3048, yd:0.9144, mile:1609.344,
  mg:1e-6, g:0.001, kg:1, oz:0.0283495, lb:0.453592, ton:1000,
  sqm:1, sqft:0.092903, acre:4046.86, hectare:10000,
  ml:0.001, l:1, m3:1000, ft3:28.3168, gal:3.78541,
  'km/h':1, mph:1.60934, 'm/s':3.6,
  sec:1, min:60, hr:3600, day:86400, week:604800
};
const CAT_LABEL_KEY = {
  length:'uc.length', weight:'uc.weight', area:'uc.area',
  volume:'uc.volume', speed:'uc.speed', time:'uc.time', temp:'uc.temp'
};
register('unit_conv', {
  cat:'converter', icon:'🔀',
  title:{en:'Unit Converter', bn:'একক রূপান্তর'},
  desc:{en:'Length, Weight, Area, Volume, Speed, Time, Temperature.', bn:'দৈর্ঘ্য, ওজন, ক্ষেত্রফল, আয়তন, গতি, সময়, তাপমাত্রা।'},
  render(){
    const catOpts = Object.keys(CAT_LABEL_KEY).map(k=>`<option value="${k}">${t(CAT_LABEL_KEY[k])}</option>`).join('');
    return `
      <div class="panel">
        <h2>🔀 ${t('uc.title')}</h2>
        <p class="panel-desc">${t('uc.desc')}</p>
        <div class="form-grid">
          <div class="field"><label>${t('uc.cat')}</label>
            <select id="uc_cat">${catOpts}</select></div>
          <div class="field"><label>${t('uc.value')}</label><input id="uc_v" type="number" placeholder="1" /></div>
          <div class="field"><label>${t('uc.from')}</label><select id="uc_f"></select></div>
          <div class="field"><label>${t('uc.to')}</label><select id="uc_t"></select></div>
        </div>
        <div class="actions row">
          <button class="btn btn-primary" onclick="calcUc()">${t('btn.convert')}</button>
          <button class="btn btn-ghost" onclick="swapUc()">⇅ ${t('btn.swap')}</button>
        </div>
        <div id="resultHolder"></div>
        <div class="error-msg" id="errBox"></div>
      </div>
    `;
  },
  onOpen: ()=>{
    setTimeout(populateUcUnits, 0);
    const cat = el('uc_cat');
    if(cat) cat.onchange = populateUcUnits;
  }
});
function populateUcUnits(){
  const cat = el('uc_cat');
  if(!cat) return;
  const c = cat.value;
  const f = el('uc_f'), tt = el('uc_t');
  if(!f || !tt) return;
  if(c === 'temp'){
    const opts = `<option value="C">${ulabel('C')}</option><option value="F">${ulabel('F')}</option><option value="K">${ulabel('K')}</option>`;
    f.innerHTML = opts; tt.innerHTML = opts;
    f.value = 'C'; tt.value = 'F';
  } else {
    const keys = UNITS[c];
    const opts = keys.map(k=>`<option value="${k}">${ulabel(k)}</option>`).join('');
    f.innerHTML = opts; tt.innerHTML = opts;
    f.value = keys[0]; tt.value = keys[1] || keys[0];
  }
}
function swapUc(){
  const f = el('uc_f'), t = el('uc_t');
  if(!f||!t) return;
  const tmp = f.value; f.value = t.value; t.value = tmp;
  calcUc();
}
function calcUc(){
  hideErr(); clearResult();
  const v = numVal('uc_v');
  if(v===null){ showErr(t('err.fill')); return; }
  if(isNaN(v)){ showErr(t('err.number')); return; }
  const c = strVal('uc_cat');
  const f = strVal('uc_f'), tt = strVal('uc_t');
  let out;
  if(c === 'temp'){
    let cel;
    if(f === 'C') cel = v;
    else if(f === 'F') cel = (v-32)*5/9;
    else cel = v - 273.15;
    if(tt === 'C') out = cel;
    else if(tt === 'F') out = cel*9/5 + 32;
    else out = cel + 273.15;
  } else {
    const uf = UNIT_VALUES[f], ut = UNIT_VALUES[tt];
    if(!uf || !ut){ showErr(t('err.generic')); return; }
    out = v*uf/ut;
  }
  el('resultHolder').innerHTML = resultHTML(fmt(out,6)+' '+ulabel(tt));
}

  const grid = el('catGrid');
  grid.innerHTML = CATEGORIES.map(c=>{
    const count = Object.values(CALCS).filter(x=>x.cat === c.id).length;
    return `
      <button type="button" class="cat-card" onclick="showCategory('${c.id}')">
        <div class="cat-icon">${c.icon}</div>
        <div class="cat-name">${t('cat.'+c.id)}</div>
        <div class="cat-desc">${t('cat.'+c.id+'.desc')}</div>
        <div class="cat-count">${count} ${t('cat.count')}</div>
      </button>
    `;
  }).join('');
}

function showCategory(catId){
  currentCategory = catId;
  const cat = CATEGORIES.find(c=>c.id === catId);
  if(!cat){ goHome(); return; }
  const list = Object.values(CALCS).filter(c=>c.cat === catId);
  if(!list.length){ goHome(); return; }

  el('crumbCat').textContent = t('cat.'+catId);
  el('catTitle').textContent = t('cat.'+catId);
  el('catSubtitle').textContent = t('cat.'+catId+'.desc');

  el('calcGrid').innerHTML = list.map(c=>{
    const title = LANG==='bn' ? c.title.bn : c.title.en;
    const desc  = LANG==='bn' ? c.desc.bn  : c.desc.en;
    return `
      <button type="button" class="calc-card" onclick="showCalc('${c.id}')">
        <div class="calc-icon">${c.icon}</div>
        <div class="calc-body">
          <div class="calc-title">${title}</div>
          <div class="calc-desc">${desc}</div>
        </div>
      </button>
    `;
  }).join('');

  showView('category');
}

function showCalc(id){
  const c = CALCS[id];
  if(!c){ goHome(); return; }
  currentCalcId = id;

  const crumbCatBtn = el('crumbCatBtn');
  crumbCatBtn.textContent = t('cat.'+c.cat);
  crumbCatBtn.onclick = ()=> showCategory(c.cat);
  el('crumbCalc').textContent = LANG==='bn' ? c.title.bn : c.title.en;

  const host = el('calcHost');
  host.innerHTML = c.render();
  if(c.onOpen) c.onOpen();

  showView('calc');
}

function goBackToCategory(){
  if(currentCategory) showCategory(currentCategory);
  else goHome();
}

function goHome(){
  currentCategory = null;
  currentCalcId = null;
  showView('home');
}

/* =========================================================================
   FAQ
   ========================================================================= */
const FAQ_ITEMS = [
  ['q1','a1'],['q2','a2'],['q3','a3'],['q4','a4'],
  ['q5','a5'],['q6','a6'],['q7','a7'],['q8','a8'],
  ['q9','a9'],['q10','a10'],['q11','a11'],['q12','a12']
];
function renderFaq(){
  const host = el('faqList');
  if(!host) return;
  host.innerHTML = FAQ_ITEMS.map(([q,a],i)=>`
    <div class="faq-item" id="faq-${i}">
      <button class="faq-q" type="button" onclick="toggleFaq(${i})">
        <span>${t('faq.'+q)}</span>
        <span class="sign">+</span>
      </button>
      <div class="faq-a">${t('faq.'+a)}</div>
    </div>
  `).join('');
}
function toggleFaq(i){
  FAQ_ITEMS.forEach((_,idx)=>{
    if(idx !== i){
      const it = el('faq-'+idx);
      if(it && it.classList.contains('open')){
        it.classList.remove('open');
        const s = it.querySelector('.sign'); if(s) s.textContent = '+';
      }
    }
  });
  const item = el('faq-'+i);
  if(!item) return;
  const wasOpen = item.classList.contains('open');
  item.classList.toggle('open', !wasOpen);
  const sign = item.querySelector('.sign');
  if(sign) sign.textContent = !wasOpen ? '−' : '+';
}

/* =========================================================================
   INFO ACCORDIONS
   ========================================================================= */
function toggleAcc(key){
  const acc = el('acc-'+key);
  if(!acc) return;
  const wasOpen = acc.classList.contains('open');
  ['about','privacy','terms','disclaimer','contact'].forEach(k=>{
    const a = el('acc-'+k);
    if(a && a.classList.contains('open')){
      a.classList.remove('open');
      const s = a.querySelector('.sign'); if(s) s.textContent = '+';
    }
  });
  if(!wasOpen){
    acc.classList.add('open');
    const s = acc.querySelector('.sign'); if(s) s.textContent = '−';
    setTimeout(()=>{
      const head = acc.querySelector('.acc-head');
      if(head) head.scrollIntoView({behavior:'smooth', block:'start'});
    }, 80);
  }
}

}

  const host = el('availGrid');

    <div class="avail-item">

   SCROLL
   ========================================================================= */
function scrollToId(id){
  const target = el(id);
  if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
}

/* =========================================================================
   INIT
   ========================================================================= */
(function init(){
  applyTheme(localStorage.getItem('ac_theme') || 'light');
  el('year').textContent = new Date().getFullYear();

  document.documentElement.lang = LANG === 'bn' ? 'bn' : 'en';
  el('lang-en').classList.toggle('active', LANG === 'en');
  el('lang-bn').classList.toggle('active', LANG === 'bn');

  refreshStaticI18N();
  renderFaq();
  renderAvailGrid();
  renderWhyGrid();
  renderHome();
  showView('home');
})();
